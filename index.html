<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0e0b0b;
        color: white;
        font-family: sans-serif;
      }

      h1 {
        text-align: center;
        padding: 20px;
      }

      #checkboxes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 20px;
      }

      .checkbox {
        width: 40px;
        height: 40px;
        background: rgb(168, 26, 145);
        border: 1px dashed powderblue;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .checkbox.checked {
        background: limegreen;
        border: 2px solid white;
      }

      .checkbox.checked::after {
        content: "✔";
        color: white;
        font-size: 24px;
      }

      #loader {
        text-align: center;
        padding: 30px;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <h1>1 Million Checkboxes</h1>

    <div id="checkboxes"></div>
    <div id="loader">Loading...</div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();

      const container = document.getElementById("checkboxes");
      const loader = document.getElementById("loader");

      const TOTAL = 1000000;
      const CHUNK_SIZE = 1000;

      let loaded = 0;

      // store rendered elements only
      const renderedBoxes = new Map();

      // load chunk
      async function loadChunk() {
        if (loaded >= TOTAL) {
          loader.innerText = "All loaded";
          return;
        }

        const start = loaded;
        const end = Math.min(start + CHUNK_SIZE, TOTAL);

        const res = await fetch(`/states?start=${start}&end=${end}`);
        const states = await res.json();

        const fragment = document.createDocumentFragment();

        for (let i = start; i < end; i++) {
          const box = document.createElement("div");

          box.className = "checkbox";

          if (states[i - start]) {
            box.classList.add("checked");
          }

          box.dataset.index = i;

          box.addEventListener("click", () => {
            const checked = box.classList.toggle("checked");

            socket.emit("toggle-checkbox", {
              index: i,
              checked,
            });
          });

          renderedBoxes.set(i, box);

          fragment.appendChild(box);
        }

        container.appendChild(fragment);

        loaded = end;
      }

      // initial load
      loadChunk();

      // infinite scroll
      window.addEventListener("scroll", () => {
        const nearBottom =
          window.innerHeight + window.scrollY >=
          document.body.offsetHeight - 500;

        if (nearBottom) {
          loadChunk();
        }
      });

      // realtime updates
      socket.on("update-checkbox", ({ index, checked }) => {
        const box = renderedBoxes.get(index);

        if (!box) return;

        if (checked) {
          box.classList.add("checked");
        } else {
          box.classList.remove("checked");
        }
      });
    </script>
  </body>
</html>
